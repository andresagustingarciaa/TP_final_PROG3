info:
  name: POST - Asociar obra social
  type: http
  seq: 8

http:
  method: POST
  url: http://localhost:3000/api/v1/medicos/1/obras-sociales
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "id_obra_social": 2
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ASOCIA una obra social a un médico.

  Cambia el ID del médico en la URL y el id_obra_social en el body.

  Respuesta exitosa: 201
  Médico no encontrado: 404
  Obra social no encontrada: 404
  Ya asociada: 409
