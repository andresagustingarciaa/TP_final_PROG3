info:
  name: POST - Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/v1/auth/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "lopmar@correo.com",
        "contrasenia": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  INICIA SESIÓN y devuelve un token JWT.

  Campos del body:
  - email: el email del usuario
  - contrasenia: la contraseña

  Si todo sale bien devuelve algo así:
  {
    "ok": true,
    "data": {
      "token": "eyJhbG...",
      "rol": 1
    }
  }

  Roles:
  - 1 = médico
  - 2 = paciente
  - 3 = administrador

  Respuesta exitosa: 200
  Email o contraseña incorrectos: 401
  Error del servidor: 500

  Usuarios de prueba (según db.sql):
  - lopmar@correo.com (médico)
  - lopjac@correo.com (paciente)
  - ferben@correo.com (admin)
​