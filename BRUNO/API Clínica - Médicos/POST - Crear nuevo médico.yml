info:
  name: POST - Crear nuevo médico
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3000/api/v1/medicos
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "documento": "31000999",
        "apellido": "García",
        "nombres": "Ana",
        "email": "ana@correo.com",
        "contrasenia": "123456",
        "id_especialidad": 1,
        "matricula": 5000,
        "descripcion": "Pediatra",
        "valor_consulta": 8000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  CREA un nuevo médico (crea el usuario y el registro en medicos).

  Cambia documento, email y matricula para que no se repitan con los que ya existen en la base.

  Respuesta exitosa: 201
  Datos inválidos: 400
  Duplicado (email, documento o matrícula): 409
​