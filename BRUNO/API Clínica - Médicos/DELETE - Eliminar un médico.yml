info:
  name: DELETE - Eliminar un médico
  type: http
  seq: 5

http:
  method: DELETE
  url: http://localhost:3000/api/v1/medicos/1
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ELIMINA un médico (soft delete = desactiva el usuario asociado, no borra el registro).

  Cambia el número al final por el ID que quieras borrar.

  Respuesta exitosa: 200
  No encontrado: 404
  ID inválido: 400
