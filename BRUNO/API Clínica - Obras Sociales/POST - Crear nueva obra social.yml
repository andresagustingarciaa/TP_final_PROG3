info:
  name: POST - Crear nueva obra social
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3000/api/v1/obras-sociales
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nombre": "OSDE",
        "descripcion": "obra social de prueba",
        "porcentaje_descuento": 15,
        "es_particular": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  CREA una nueva obra social. Cambia los datos por lo que quieras crear.

  Campos:
  - nombre: texto, máximo 120 caracteres
  - descripcion: texto, máximo 255 caracteres
  - porcentaje_descuento: número entre 0 y 100
  - es_particular: true o false

  Respuesta exitosa: 201
  Datos inválidos: 400
  Nombre duplicado: 409
