info:
  name: PUT - Editar una obra social
  type: http
  seq: 4

http:
  method: PUT
  url: http://localhost:3000/api/v1/obras-sociales/1
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nombre": "OSDE Plus",
        "descripcion": "obra social actualizada",
        "porcentaje_descuento": 20,
        "es_particular": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  MODIFICA una obra social existente. Cambia:
  - El ID (número al final de la URL) por el que quieras editar
  - Los campos del JSON por los nuevos valores

  Respuesta exitosa: 200
  No encontrada: 404
  Datos inválidos: 400
  Nombre duplicado: 409
