info:
  name: DELETE - Desasociar obra social
  type: http
  seq: 9

http:
  method: DELETE
  url: http://localhost:3000/api/v1/medicos/1/obras-sociales/2
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  DESASOCIA una obra social de un médico (soft delete en medicos_obras_sociales).

  Cambia:
  - El primer número = ID del médico
  - El segundo número = ID de la obra social

  Respuesta exitosa: 200
  Asociación no encontrada: 404
